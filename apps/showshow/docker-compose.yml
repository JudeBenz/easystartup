services:
  postgres:
    image: postgres:16-alpine
    container_name: showshow-postgres
    environment:
      POSTGRES_USER: showshow
      POSTGRES_PASSWORD: showshow
      POSTGRES_DB: showshow
    ports:
      - "5432:5432"
    volumes:
      - showshow_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U showshow -d showshow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  showshow_pg:
